modules:
  # Standard GET requests (for health checks, homepage)
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []  # Defaults to 2xx
      method: GET
      preferred_ip_protocol: "ip4"
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      
  # Standard POST requests with JSON body
  http_post_2xx:
    prober: http
    timeout: 5s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{"test": "true"}'
      valid_status_codes: [200, 201]

  # POST with authentication (replace YOUR_MONITORING_TOKEN with actual token)
  # http_with_auth:
  #   prober: http
  #   timeout: 5s
  #   http:
  #     method: POST
  #     headers:
  #       Content-Type: application/json
  #       Authorization: "Bearer YOUR_MONITORING_TOKEN"
  #     body: '{"email":"monitor@test.com"}'
  #     valid_status_codes: [200, 201, 400, 401, 422]  # Accept auth errors as "up"
  #     follow_redirects: true

  # Accept any HTTP response (just check if server responds)
  http_any_response:
    prober: http
    timeout: 5s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{}'
      valid_status_codes: []  # Accept ANY status code (even 404, 401)
      follow_redirects: true