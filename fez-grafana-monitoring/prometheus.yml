global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'riders-api-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alerts.yml'

scrape_configs:
  # Local GET endpoint monitoring only
  - job_name: 'blackbox'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://rider-api.fezdelivery.co
        labels:
          endpoint_type: "local_health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Blackbox exporter metrics endpoint
  - job_name: 'blackbox_exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['blackbox:9115']